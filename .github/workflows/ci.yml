name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Docker Login
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ env.SHORT_SHA }}
      - name: Notify team on Discord
        run: |
          curl -H "Content-Type: application/json" --fail \
          -d '{"content": "New image ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ env.SHORT_SHA }} pushed to Docker Hub. https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/calculator-app"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
